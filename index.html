<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaca Pro — Ramalan Real-time</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     SVG SPRITE — semua icon terdefinisi di sini, dipakai via <use>
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.9" y1="4.9" x2="7" y2="7"/>
        <line x1="17" y1="17" x2="19.1" y2="19.1"/>
        <line x1="4.9" y1="19.1" x2="7" y2="17"/>
        <line x1="17" y1="7" x2="19.1" y2="4.9"/>
      </g>
    </symbol>

    <symbol id="i-cloud" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.5 19a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.7 9.2 4 4 0 0 1 17 19H6.5z"/>
    </symbol>

    <symbol id="i-sun-cloud" viewBox="0 0 24 24">
      <circle cx="8" cy="7" r="3" fill="currentColor" opacity="0.9"/>
      <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity="0.9">
        <line x1="8" y1="1.5" x2="8" y2="3"/>
        <line x1="2.5" y1="7" x2="4" y2="7"/>
        <line x1="3.7" y1="2.7" x2="4.7" y2="3.7"/>
      </g>
      <path fill="currentColor" d="M9.5 20a4 4 0 0 1-.4-7.98A5.5 5.5 0 0 1 19.4 12 3.5 3.5 0 0 1 19 20H9.5z"/>
    </symbol>

    <symbol id="i-rain" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.5 15a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.7 5.2 4 4 0 0 1 17 15H6.5z"/>
      <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="8" y1="17" x2="7" y2="20"/>
        <line x1="12" y1="17" x2="11" y2="20"/>
        <line x1="16" y1="17" x2="15" y2="20"/>
      </g>
    </symbol>

    <symbol id="i-drizzle" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.5 15a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.7 5.2 4 4 0 0 1 17 15H6.5z"/>
      <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="9" y1="17" x2="9" y2="18.5"/>
        <line x1="13" y1="17" x2="13" y2="18.5"/>
        <line x1="17" y1="17" x2="17" y2="18.5"/>
      </g>
    </symbol>

    <symbol id="i-thunder" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.5 14a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.7 4.2 4 4 0 0 1 17 14H6.5z"/>
      <path fill="#f6c445" stroke="#000" stroke-width="0.5" d="M13 12l-3.5 5.5H12l-1 4 4.5-6H13l1-3.5z"/>
    </symbol>

    <symbol id="i-snow" viewBox="0 0 24 24">
      <path fill="currentColor" d="M6.5 15a4.5 4.5 0 0 1-.5-8.97A6 6 0 0 1 17.7 5.2 4 4 0 0 1 17 15H6.5z"/>
      <g fill="currentColor">
        <circle cx="8" cy="18" r="1"/>
        <circle cx="12" cy="19.5" r="1"/>
        <circle cx="16" cy="18" r="1"/>
        <circle cx="10" cy="21" r="1"/>
        <circle cx="14" cy="21.5" r="1"/>
      </g>
    </symbol>

    <symbol id="i-mist" viewBox="0 0 24 24">
      <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="3" y1="8" x2="21" y2="8"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
        <line x1="3" y1="16" x2="21" y2="16"/>
        <line x1="6" y1="20" x2="18" y2="20"/>
      </g>
    </symbol>

    <symbol id="i-pin" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
    </symbol>

    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-droplet" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.5s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"/>
    </symbol>

    <symbol id="i-wind" viewBox="0 0 24 24">
      <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 8h11a3 3 0 1 0-3-3"/>
        <path d="M3 12h15a3 3 0 1 1-3 3"/>
        <path d="M3 16h9a2.5 2.5 0 1 1-2.5 2.5"/>
      </g>
    </symbol>

    <symbol id="i-thermo" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M14 14.76V5a2 2 0 1 0-4 0v9.76a4 4 0 1 0 4 0z"/>
      <circle cx="12" cy="18" r="2" fill="currentColor"/>
    </symbol>

    <symbol id="i-refresh" viewBox="0 0 24 24">
      <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/>
    </symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="header">
    <div class="brand">
      <svg class="brand-icon" width="32" height="32" aria-hidden="true">
        <use href="#i-sun-cloud"/>
      </svg>
      <h1>Cuaca Pro</h1>
    </div>
    <button class="unit-toggle" id="unitToggle" title="Ganti satuan">°C</button>
  </header>

  <div class="search-box">
    <input type="text" id="cityInput" placeholder="Cari kota..." autocomplete="off">
    <button id="searchBtn" class="btn-primary" title="Cari">
      <svg width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
    </button>
    <button id="locationBtn" class="btn-secondary" title="Gunakan lokasi saya">
      <svg width="18" height="18" aria-hidden="true"><use href="#i-pin"/></svg>
    </button>
  </div>

  <div class="status" id="status"></div>

  <section class="weather-card hidden" id="weatherCard">
    <div class="weather-main">
      <div class="weather-info">
        <h2 id="cityName">—</h2>
        <p class="weather-desc" id="description">—</p>
        <div class="temp" id="temperature">—</div>
        <div class="meta">
          <span class="meta-item">
            <svg width="16" height="16" aria-hidden="true"><use href="#i-droplet"/></svg>
            <span id="humidity">—</span>%
          </span>
          <span class="meta-item">
            <svg width="16" height="16" aria-hidden="true"><use href="#i-wind"/></svg>
            <span id="wind">—</span> m/s
          </span>
          <span class="meta-item">
            <svg width="16" height="16" aria-hidden="true"><use href="#i-thermo"/></svg>
            <span id="feelsLike">—</span>°
          </span>
        </div>
      </div>
      <div class="weather-icon-wrap" id="currentIconWrap">
        <svg class="weather-icon" width="110" height="110" aria-hidden="true">
          <use id="currentIconUse" href="#i-sun-cloud"/>
        </svg>
      </div>
    </div>

    <div class="forecast">
      <h3>
        <svg width="14" height="14" aria-hidden="true" style="vertical-align:-2px;margin-right:6px">
          <use href="#i-refresh"/>
        </svg>
        Ramalan 24 Jam
      </h3>
      <div class="forecast-list" id="forecastList"></div>
    </div>
  </section>

  <footer class="footer">
    <small>Powered by OpenWeatherMap</small>
  </footer>
</div>

<script type="module" src="tracker.js"></script>
<script src="script.js"></script>
</body>
</html>
